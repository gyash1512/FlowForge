[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowforge-sdk"
version = "0.1.0"
description = "FlowForge — Code-First Workflow Engine (Python SDK)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["flowforge_sdk"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"
