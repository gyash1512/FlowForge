name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish FlowForge package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:ci

      # Dynamically set the scoped package name from the repo owner
      # so no username ever appears in committed code
      - name: Set package scope
        working-directory: packages/flowforge
        run: |
          SCOPE="${{ github.repository_owner }}"
          jq --arg name "@${SCOPE}/flowforge" '.name = $name' package.json > tmp.json
          mv tmp.json package.json
          cat package.json | head -5

      - name: Publish to GitHub Packages
        working-directory: packages/flowforge
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
