version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-flowforge}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-flowforge}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nango:
    image: nangohq/nango:latest
    restart: unless-stopped
    ports:
      - "${NANGO_PORT:-3003}:3003"
    environment:
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-nango-secret}
      NANGO_DB_HOST: postgres
      NANGO_DB_PORT: 5432
      NANGO_DB_USER: ${POSTGRES_USER:-flowforge}
      NANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      NANGO_DB_NAME: ${NANGO_DB_NAME:-nango}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-4000}:4000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-flowforge}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge}@postgres:5432/${POSTGRES_DB:-flowforge}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  integration-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.integration
    restart: unless-stopped
    ports:
      - "${INTEGRATION_PORT:-4001}:4001"
      - "${GRPC_PORT:-50051}:50051"
    environment:
      NANGO_URL: http://nango:3003
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-nango-secret}
      INTEGRATION_PORT: 4001
      GRPC_PORT: 50051
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - nango

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-flowforge}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge}@postgres:5432/${POSTGRES_DB:-flowforge}
      CONDUIT_API_KEY: ${CONDUIT_API_KEY:-}
      DASHBOARD_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
